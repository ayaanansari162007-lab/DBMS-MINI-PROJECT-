<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Management</title>
</head>

<body>

    <h1>Patient Management</h1>

    <h2>Patient Records</h2>
    <form action="/search_patient" method="GET">
        <input type="text" name="name" placeholder="Enter patient name" value="{{ search_name or '' }}" required>
        <button type="submit">Search Patient</button>
    </form>

    <br>

    <a href="/add_patient">
        <button type="button">+ Add New Patient</button>
    </a>

    <br><br>
    <table border="1" cellpadding="10">
        <tr>
            <th>Patient ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Action</th>
        </tr>

        {% for patient in patients %}
        <tr>
            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[2] }}</td>
            <td>{{ patient[3] }}</td>
            <td>{{ patient[4] }}</td>
            <td>{{ patient[6] }}</td>
            <td>
                <a href="/update_patient/{{ patient[0] }}">
                    <button type="button">Edit</button>
                </a>

                <form action="/delete_patient/{{ patient[0] }}" method="POST" style="display:inline;"
                    onsubmit="return confirm('Are you sure you want to delete this patient?');">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Back to Dashboard</a>

</body>

</html>
