<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Doctor Management</title>
</head>

<body>

    <h1>Doctor Management</h1>
    <h2>Doctor Records</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Doctor ID</th>
            <th>Name</th>
            <th>Specialization</th>
        </tr>

        {% for doctor in doctors %}
        <tr>
            <td>{{ doctor[0] }}</td>
            <td>{{ doctor[1] }}</td>
            <td>{{ doctor[2] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Back to Dashboard</a>

</body>

</html>
