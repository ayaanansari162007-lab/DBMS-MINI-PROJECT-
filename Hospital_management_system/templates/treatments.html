<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Treatment Records</title>
</head>
<body>

    <h1>Treatment Management</h1>
    <h2>Treatment Records</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>Treatment ID</th>
            <th>Appointment ID</th>
            <th>Diagnosis</th>
            <th>Prescription</th>
        </tr>

        {% for treatment in treatments %}
        <tr>
            <td>{{ treatment[0] }}</td>
            <td>{{ treatment[1] }}</td>
            <td>{{ treatment[2] }}</td>
            <td>{{ treatment[3] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Back to Dashboard</a>

</body>
</html>
