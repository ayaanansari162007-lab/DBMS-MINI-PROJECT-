<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Payment Summary Report</title>
</head>

<body>

    <h1>Payment Summary Report</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Payment Status</th>
            <th>Total Bills</th>
            <th>Total Amount</th>
        </tr>

        {% for row in report %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
            <td>₹{{ "%.2f"|format(row[2] or 0) }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="/">Back to Dashboard</a>

</body>

</html>
