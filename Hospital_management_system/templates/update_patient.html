<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Patient</title>
</head>
<body>

    <h1>Update Patient Details</h1>

    <form method="POST">
        <label>Name:</label>
        <input type="text" name="name" value="{{ patient[1] }}" required>
        <br><br>

        <label>Age:</label>
        <input type="number" name="age" value="{{ patient[2] }}" min="0" max="130" required>
        <br><br>

        <label>Gender:</label>
        <select name="gender" required>
            <option value="Male" {% if patient[3] == 'Male' %}selected{% endif %}>Male</option>
            <option value="Female" {% if patient[3] == 'Female' %}selected{% endif %}>Female</option>
            <option value="Other" {% if patient[3] == 'Other' %}selected{% endif %}>Other</option>
        </select>
        <br><br>

        <label>Phone:</label>
        <input type="text" name="phone" value="{{ patient[4] }}">
        <br><br>

        <label>Address:</label>
        <input type="text" name="address" value="{{ patient[5] }}">
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ patient[6] }}">
        <br><br>

        <button type="submit">Update Patient</button>
    </form>

    <br>
    <a href="/patients">Back to Patients</a>

</body>
</html>
